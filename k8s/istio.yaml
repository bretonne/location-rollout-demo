apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: demo-gateway
  namespace: kubecon-demo
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "demo.local"
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: ui
  namespace: kubecon-demo
spec:
  host: ui
  subsets:
    - name: v1
      labels:
        route: v1
    - name: v2
      labels:
        route: v2
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: demo-routes
  namespace: kubecon-demo
spec:
  hosts:
    - "demo.local"
  gateways:
    - "demo-gateway"
  http:
    # API route first: match /api and send to api service
    - match:
        - uri:
            prefix: "/api"
      route:
        - destination:
            host: api
            port:
              number: 8080

    # UI header-based rollout
    - match:
        - headers:
            x-software-route:
              exact: "v1"
      route:
        - destination:
            host: ui
            subset: v1
            port:
              number: 80

    - match:
        - headers:
            x-software-route:
              exact: "v2"
      route:
        - destination:
            host: ui
            subset: v2
            port:
              number: 80

    # Default catch-all route for unmatched requests (e.g., root / without header) to v1
#    - match:
#        - uri:
#            prefix: "/"
#      route:
#        - destination:
#            host: ui
#            subset: v1
#            port:
#              number: 80