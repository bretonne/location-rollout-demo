apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: kubecon-demo
  labels:
    app: ui
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
        version: v1
    spec:
      containers:
        - name: ui
          image: location-rollout-ui:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: kubecon-demo
spec:
  selector:
    app: ui
  ports:
    - name: http-ui
      port: 80
      targetPort: 80
